<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Evan's Webdev Final Project</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
          <a class="navbar-brand" href="site.html">Evan's Webdev Final Project Page</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="site.html#about">About</a>
              <a class="nav-link" href="site.html#projects">Projects</a>
              <a class="nav-link" href="resume.html">Experience</a>
              <a class="nav-link active" href="contact.html">Contact</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <section id="contact" class="container my-5">
      <h1 class="text-center text-decoration-underline mb-4">Contact</h1>
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <form>
            <div class="mb-3">
              <label for="contactName" class="form-label">Name</label>
              <input
                type="text"
                class="form-control"
                id="contactName"
                placeholder="Your name"
                required
              />
            </div>
            <div class="mb-3">
              <label for="contactEmail" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="contactEmail"
                placeholder="your@email.com"
                required
              />
            </div>
            <div class="mb-3">
              <label for="contactMessage" class="form-label">Message</label>
              <textarea
                class="form-control"
                id="contactMessage"
                rows="5"
                placeholder="Your message..."
                required
              ></textarea>
            </div>
            <div class="text-center">
              <button type="submit" class="btn">Send Message</button>
            </div>
            <div class="text-center">
              <a href="site.html" class="btn">Home</a>
            </div>
          </form>
        </div>
      </div>
    </section>

    <footer class="text-center py-3">
      <p class="mb-0">&copy; Evan's Webdev Final Project</p>
    </footer>
  </body>
</html>
